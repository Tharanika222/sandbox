# Mijn onderwerp


Ik ben geïnteresseerd in de relatie tussen **kleding en cultuur**

Kleding kan aantonen:
- waar je vandaan komt
- bij welke cultuur of gemeenschap jij je verbonden voelt
- hoe tradities veranderen
- hoe culturele kleding terugkomt in moderne modetrends
